<div class="campo{% if campo.field.widget.input_type == 'checkbox' %} check{% endif %}">
  {% if campo.field.widget.input_type == 'checkbox' %}<label>{{ campo }} {{ campo.label }}</label>
  {% else %}<label for="{{ campo.id_for_label }}">{{ campo.label }}</label>{{ campo }}{% endif %}
  {% for e in campo.errors %}<div class="error">{{ e }}</div>{% endfor %}
  {% if campo.help_text %}<small>{{ campo.help_text }}</small>{% endif %}
</div>
